name: Table Mode and companion tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run companion unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Table Mode JavaScript syntax
        run: node --check static/table_mode.js
      - name: Set up Lua 5.2 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Check TTS Lua helper syntax
        run: luac5.2 -p helper_object_mobile_actions.lua
